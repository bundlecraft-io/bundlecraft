[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Add markers for different test categories
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Tests that take longer to run
    builder: Tests for the builder module
    converter: Tests for the converter module
    verifier: Tests for the verifier module
    helpers: Tests for helper modules
    filters: Tests for certificate filtering logic
    config: Tests for configuration loading and merging
    dry_run: Tests for dry-run functionality

# Configure test output
addopts =
    --verbose
    --tb=short
    --strict-markers
    --show-capture=no
