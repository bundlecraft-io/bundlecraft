---
# =====================================================================
# Production Craft Configuration
# =====================================================================
# Craft configs define HOW to build and WHERE to distribute.
# Controls output formats, verification, secrets, and deployment targets.
# =====================================================================
name: Production
description: Production craft with full certificate suite and signed releases
# ---------------------------------------------------------------------
# Bundle Composition
# ---------------------------------------------------------------------
targets:
  internal-prod:
    includes: [internal, mozilla]  # Merge internal + Mozilla roots
  mozilla-only:
    includes: [mozilla]  # Mozilla roots only
# ---------------------------------------------------------------------
# Output Configuration
# ---------------------------------------------------------------------
output_formats:
  - pem  # Canonical PEM bundle
  - p7b  # PKCS#7 DER format
  - jks  # Java KeyStore
  - p12  # PKCS#12 / PFX
package: true  # Create .tar.gz archives
# ---------------------------------------------------------------------
# Verification & Filtering
# ---------------------------------------------------------------------
verify:
  fail_on_expired: true  # Abort on expired certificates
  warn_days_before_expiry: 30  # Warn within 30 days of expiration
filters:
  unique_by_fingerprint: true  # Deduplicate by SHA256
  not_expired_only: true  # Exclude expired certs
  ca_certs_only: true  # Only CA certificates
pem:
  include_subject_comments: true  # Add "# Subject:" comments
# ---------------------------------------------------------------------
# Format-Specific Configuration
# ---------------------------------------------------------------------
format_overrides:
  jks:
    storepass_env: TRUST_JKS_PASSWORD  # Password from environment
    alias_format: '{subject.CN}-{serial}'
  pkcs12:
    password_env: TRUST_P12_PASSWORD  # Password from environment
## ---------------------------------------------------------------------
# Distribution Metadata (for CI/CD pipeline use only)
# ---------------------------------------------------------------------
# NOTE: BundleCraft CLI does NOT publish or upload bundles directly.
# This section provides metadata for CI/CD pipelines (e.g., GitHub Actions)
# to know where and how to distribute built bundles. Keys/values are flexible.
distribution_metadata:
  targets:
    - type: github-release
      enabled: false  # Only used for testing in CI/CD
      description: Publish to GitHub Releases (handled by pipeline)
      assets:
        - bundlecraft-trust.tar.gz
        - bundlecraft-trust-env-*.tar.gz
        - '*.sha256'
        - '*.asc'  # GPG signatures
    - type: artifactory
      enabled: false
      description: 'Example: JFrog Artifactory (not used currently)'
    - type: s3
      enabled: false
      description: 'Example: AWS S3 (not used currently)'
  tags:
    - production
    - signed
    - ci-cd
    - github-release
# ---------------------------------------------------------------------
# Metadata
# ---------------------------------------------------------------------
metadata:
  contact: security@bundlecraft.io
  environment_tier: production
  compliance: SOC2, ISO27001
  approval_required: true
