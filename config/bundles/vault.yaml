---
bundle_name: vault
description: Trust bundle sourced from HashiCorp Vault secret store
include: []
exclude: []
fetch:
  - name: from_vault
    type: vault
    mount_point: secret
    path: pki/trusted_roots
    pem_field: pem
    addr: http://127.0.0.1:8200
    token_ref: VAULT_TOKEN
    namespace: ''  # Optional Vault namespace
metadata:
  owner: secrets-management-team@example.com
  purpose: Dynamic trust store from centralized secret management
  tags: [vault, dynamic, secrets]
