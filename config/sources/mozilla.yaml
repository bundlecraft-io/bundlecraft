---
apiVersion: bundlecraft.io/v1alpha1
kind: SourceConfig
source_name: mozilla
description: Mozilla NSS CA certificate program - publicly trusted root CAs
fetch:
  - name: mozilla_roots
    type: url
    url: https://curl.se/ca/cacert.pem
metadata:
  owner: mozilla-nss-maintainers
  purpose: Public web PKI trust anchors
  upstream: https://wiki.mozilla.org/CA
  tags: [public, mozilla, web-pki]
  labels: {ecosystem: mozilla, visibility: public}
