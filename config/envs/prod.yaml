---
# Production environment configuration
# Defines which target bundles to build in prod and how to handle formats/passwords.
# High-importance: which targets to build and their composition
targets:
  internal-prod:
    includes: [mozilla, internal]
# Output formats for this environment (falls back to defaults if omitted)
output_formats:
  - pem
  - p7b
  - jks
  - p12
# Format overrides: use env vars for secrets in CI/CD
format_overrides:
  jks:
    # Prefer environment variable for the keystore password
    storepass_env: TRUST_JKS_PASSWORD
  pkcs12:
    # Prefer environment variable for PKCS#12 export password
    password_env: TRUST_P12_PASSWORD
# Verification policy
verify:
  fail_on_expired: true
  warn_days_before_expiry: 30
# Filtering rules
filters:
  unique_by_fingerprint: true
  not_expired_only: true
  ca_certs_only: true
# Optional metadata
metadata:
  name: Production
  contact: security@bundlecraft.io
