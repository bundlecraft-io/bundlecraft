---
# Kubernetes-style identifiers (optional but recommended)
apiVersion: bundlecraft.io/v1alpha1
kind: EnvConfig
# =====================================================================
# Example Environment Configuration for BundleCraft
# =====================================================================
# Location: config/envs/example-env.yaml
#
# Environment configs define HOW to build and WHERE to distribute.
# This controls output formats, verification policies, secrets handling,
# filtering rules, and distribution targets.
#
# Philosophy: Source configs define WHAT/WHERE (sources),
#            Environment configs define HOW/WHERE (build & deploy).
# =====================================================================
name: Example Environment
description: >
  Comprehensive example showing all environment configuration options.
  Demonstrates build settings, format overrides, verification policies,
  and distribution configuration for multiple bundle types.
  Consider your environment config files as environment-specific build recipes.
# ---------------------------------------------------------------------
# Bundle Composition
# ---------------------------------------------------------------------
# Define which bundles should be built in this environment.
# Each bundle can include/merge multiple certificate source configurations.
bundles:
  internal-dev:
    include_sources: [internal, mozilla]  # Merge internal PKI + Mozilla roots
    description: Combined trust bundle for development services
  mozilla-only:
    include_sources: [mozilla]  # Mozilla roots only
    description: Public web PKI roots
  vault-roots:
    include_sources: [vault]  # Certificates from HashiCorp Vault
    description: Dynamic certificates from Vault
# ---------------------------------------------------------------------
# Output Configuration
# ---------------------------------------------------------------------
# Specify which certificate formats to generate
output_formats:
  - pem  # Canonical PEM format (X.509 certificates)
  - p7b  # PKCS#7 DER format (.p7b)
  - jks  # Java KeyStore (.jks)
  - p12  # PKCS#12 / PFX (.p12)
# Create .tar.gz archives of build output
package: true

# Override default output path (default: dist/<env>/<bundle>/)
build_path: dist/example/
# ---------------------------------------------------------------------
# Verification & Validation
# ---------------------------------------------------------------------
verify:
  fail_on_expired: true  # Abort build if expired certificates found
  warn_days_before_expiry: 30  # Warn if cert expires within 30 days
# ---------------------------------------------------------------------
# Certificate Filtering
# ---------------------------------------------------------------------
# Apply filtering rules to all bundles in this environment
filters:
  unique_by_fingerprint: true  # Deduplicate by SHA256 fingerprint
  not_expired_only: true  # Exclude expired certificates
  ca_certs_only: true  # Only include CA certificates (BasicConstraints: CA=TRUE)
  root_certs_only: true  # Only include self-signed root CAs (filters out subordinates)
  # Optional filters (commented examples):
  # signature_algorithms:  # Filter by signature algorithm
  #   include: ["sha256WithRSAEncryption", "ecdsa-with-SHA256"]  # Whitelist
  #   exclude: ["sha1WithRSAEncryption", "md5WithRSAEncryption"]  # Blacklist weak algorithms
  # minimum_key_size_rsa: 2048  # Minimum RSA key size in bits
  # minimum_key_size_ecc: 256  # Minimum ECC key size in bits
# ---------------------------------------------------------------------
# Format-Specific Configuration
# ---------------------------------------------------------------------
format_overrides:
  jks:
    # Java KeyStore password (read from environment variable)
    storepass_env: TRUST_JKS_PASSWORD
    # Alias template for keytool imports
    # Available placeholders: {subject.CN}, {serial}, {fingerprint}, {fingerprint_sha1}, {fingerprint_sha256}
    alias_format: '{subject.CN}-{fingerprint}'
  pkcs12:
    # PKCS#12 export password (read from environment variable)
    password_env: TRUST_P12_PASSWORD
  pem:
    # Add "# Subject: CN=..." comments above each PEM block
    include_subject_comments: true
  p7b:
    # Include full certificate chain in .p7b files
    include_chain: true
# ---------------------------------------------------------------------
# Distribution Configuration
# ---------------------------------------------------------------------
# Define where and how to distribute built trust bundles.
# This provides CI/CD hints for automated publishing workflows.
distribution:
  targets:
    # GitHub Releases
    - type: github-release
      enabled: true
      description: Publish to GitHub Releases with GPG signatures
      assets:
        - bundlecraft-trust.tar.gz
        - bundlecraft-trust-*.tar.gz
        - '*.sha256'
        - '*.asc'  # GPG signature files
      draft: false
      prerelease: false

    # JFrog Artifactory
    - type: artifactory
      enabled: false
      description: Upload to JFrog Artifactory Maven repository
      url: https://artifactory.example.com
      repository: libs-release-local
      path: com/example/truststore/${VERSION}/
      auth_env: ARTIFACTORY_TOKEN  # Bearer token from environment

    # AWS S3
    - type: s3
      enabled: false
      description: Distribute via AWS S3 bucket
      bucket: company-truststores
      prefix: prod/
      region: us-east-1
      public: false
      storage_class: STANDARD

    # Azure Blob Storage
    - type: azure-blob
      enabled: false
      description: Microsoft Azure Blob Storage distribution
      account: companystorage
      container: truststores
      prefix: prod/
      public_access: false

    # Generic HTTP POST
    - type: http-post
      enabled: false
      description: POST to internal API endpoint
      url: https://internal-api.example.com/v1/truststores
      method: POST
      headers:
        - 'Authorization: Bearer ${API_TOKEN}'
        - 'Content-Type: application/octet-stream'

    # Custom distribution script
    - type: custom
      enabled: false
      description: Run custom distribution script
      command: ./scripts/distribute.sh
      args:
        - ${BUNDLE_PATH}
        - ${ENVIRONMENT}
        - ${VERSION}

  # Tags for CI/CD pipeline routing and filtering
  tags:
    - staging
    - automated-build
    - unsigned
    - testing
# ---------------------------------------------------------------------
# Metadata
# ---------------------------------------------------------------------
metadata:
  contact: security@bundlecraft.io
  environment_tier: staging
  policy_version: 2.0
  created_by: automation
  compliance: internal
  approval_required: false
