---
# Kubernetes-style identifiers (optional but recommended)
# These fields help with future controller/CRD-style validation.
# They are validated if present but are not required.
apiVersion: bundlecraft.io/v1alpha1
kind: EnvConfig
# =====================================================================
# Development Environment Configuration
# =====================================================================
# Environment configs define HOW to build and WHERE to distribute.
# Controls output formats, verification, secrets, and deployment targets.
# =====================================================================
name: development
description: Development environment for testing and local builds
# ---------------------------------------------------------------------
# Bundle Composition
# ---------------------------------------------------------------------
# Each bundle composes one or more source configs by name.
# Note: environment files intentionally do NOT reference inner repo/fetch entries
# from source configs to preserve separation of concerns and provenance.
bundles:
  internal:
    include_sources: [internal]  # Internal certs only for dev
# ---------------------------------------------------------------------
# Output Configuration
# ---------------------------------------------------------------------
build_path: dist/dev/custom
output_formats:
  - pem  # Canonical PEM bundle
  - p7b  # PKCS#7 DER format
  - jks  # Java KeyStore
  - p12  # PKCS#12 / PFX
package: true  # Create .tar.gz archives
# ---------------------------------------------------------------------
# Verification & Filtering
# ---------------------------------------------------------------------
# Build-time verification and filtering guardrails.
# Source definitions (WHAT/WHERE to gather) live in config/cert_sources/*.yaml.
# Environment controls HOW to build and distribute only.
verify:
  fail_on_expired: false  # Don't abort on expired (dev tolerant)
  warn_days_before_expiry: 30  # Still warn about expiration
filters:
  unique_by_fingerprint: true  # Deduplicate by SHA256
  not_expired_only: false  # Allow expired certs in dev
  ca_certs_only: true  # Only CA certificates
pem:
  include_subject_comments: true  # Add "# Subject:" comments
# ---------------------------------------------------------------------
# Format-Specific Configuration
# ---------------------------------------------------------------------
format_overrides:
  jks:
    storepass_env: TRUST_JKS_PASSWORD  # Password from environment
    alias_format: '{subject.CN}-{serial}'
  pkcs12:
    password_env: TRUST_P12_PASSWORD  # Password from environment
## ---------------------------------------------------------------------
# Distribution Metadata (for CI/CD pipeline use only)
# ---------------------------------------------------------------------
# NOTE: BundleCraft CLI does NOT publish or upload bundles directly.
# This section provides metadata for CI/CD pipelines (e.g., GitHub Actions)
# to know where and how to distribute built bundles. Keys/values are flexible.
distribution_metadata:
  targets:
    - type: github-release
      enabled: true  # Only used for testing in CI/CD
      description: Publish to GitHub Releases (handled by pipeline)
  assets: [bundlecraft-trust.tar.gz, bundlecraft-trust-*.tar.gz]
  repositories:
    - type: artifactory
      enabled: false
      description: 'Example: JFrog Artifactory (not used currently)'
  tags:
    - development
    - testing
    - ci-cd
    - github-release
# ---------------------------------------------------------------------
# Metadata
# ---------------------------------------------------------------------
# Free-form metadata for documentation and automation.
# You can also add labels: { key: value } to attach machine-readable tags.
metadata:
  contact: security@bundlecraft.io
  environment_tier: development
  approval_required: false
