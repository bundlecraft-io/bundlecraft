---
# =====================================================================
# Global defaults configuration for BundleCraft
# Location: config/defaults.yaml
#
# Acts as the baseline applied before merging env and bundle
# configurations. Provides safe, predictable defaults for verification,
# filtering, PEM formatting, and output behavior.
# =====================================================================
# ---------------------------------------------------------------------
# High-importance defaults (top)
# ---------------------------------------------------------------------
output_formats:
  - pem  # Concatenated PEM file (always on)
  - p7b  # PKCS#7 DER (.p7b)
  - jks  # Java KeyStore (.jks)
  - p12  # PKCS#12 (.p12)
verify:
  fail_on_expired: true  # Abort build if expired certs found (safe default)
  warn_days_before_expiry: 30  # Warn when cert expires within N days
package: false  # Do not create .tar.gz by default (env/bundle may override)
pem:
  include_subject_comments: true  # Adds "# Subject:" above each PEM block (like OS bundles)
fetch:
  timeout: 30  # Request timeout in seconds (1-600)
  retries: 3  # Number of retry attempts on transient failures (0-10)
  backoff_factor: 2.0  # Exponential backoff multiplier (1.0-10.0)
  retry_on_status: [429, 502, 503, 504]  # HTTP status codes that trigger retry
filters:
  unique_by_fingerprint: true  # Remove duplicates by SHA256 fingerprint
  not_expired_only: true  # Skip expired certs before writing outputs
  ca_certs_only: true  # Only include CA certificates (BasicConstraints: CA=TRUE)
  root_certs_only: true  # Only include self-signed root CAs (filters out subordinates)
  # signature_algorithms:  # Filter by signature algorithm (optional, undefined by default)
  #   include: ["sha256WithRSAEncryption", "ecdsa-with-SHA256"]  # Whitelist specific algorithms
  #   exclude: ["sha1WithRSAEncryption", "md5WithRSAEncryption"]  # Blacklist weak algorithms
  # minimum_key_size_rsa: 2048  # Minimum RSA key size in bits (optional)
  # minimum_key_size_ecc: 256  # Minimum ECC key size in bits (optional)
# ---------------------------------------------------------------------
# Default per-format overrides (non-sensitive defaults only)
# ---------------------------------------------------------------------
format_overrides:
  jks:
    alias_format: '{subject.CN}-{serial}'  # Default alias template for JKS imports
  pkcs12:
    filename: default-ca-bundle.p12  # Default filename if not overridden
  pem:
    include_subject_comments: true  # Reinforces default PEM annotation setting
# ---------------------------------------------------------------------
# Optional metadata
# ---------------------------------------------------------------------
metadata:
  maintainer: pki-team@bundlecraft.io  # Default contact for repository maintainers
  policy_version: 1.0  # Schema version tracking for config evolution
# ---------------------------------------------------------------------
# Craft composition guidance (env files)
#
# Crafts can declare composed target bundles that merge one or more
# base bundle configurations. Example in config/crafts/example-env.yaml:
#
# targets:
#   internal-dev:
#     includes: [internal, mozilla]
#   mozilla:
#     includes: [mozilla]
#
# Then build with:
#   bundlecraft build --env dev --bundle internal-dev
# ---------------------------------------------------------------------
