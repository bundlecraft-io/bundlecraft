---
# =====================================================================
# Global defaults configuration for PKI-CA-Trust
# Location: config/defaults.yaml
#
# Acts as the baseline applied before merging environment and bundle
# configurations. Provides safe, predictable defaults for verification,
# filtering, PEM formatting, and output behavior.
# =====================================================================
# ---------------------------------------------------------------------
# Global verification defaults
# ---------------------------------------------------------------------
verify:
  fail_on_expired: true  # Abort build if expired certs found (safe default)
  warn_days_before_expiry: 30  # Warn when cert expires within N days
# ---------------------------------------------------------------------
# Global PEM output behavior
# ---------------------------------------------------------------------
pem:
  include_subject_comments: true  # Adds "# Subject:" above each PEM block (like OS bundles)
# ---------------------------------------------------------------------
# Default filtering behavior
# ---------------------------------------------------------------------
filters:
  unique_by_fingerprint: true  # Remove duplicates by SHA256 fingerprint
  not_expired_only: true  # Skip expired certs before writing outputs
  ca_certs_only: true  # Only include CA certificates (BasicConstraints: CA=TRUE)
# ---------------------------------------------------------------------
# Default formats to build
# ---------------------------------------------------------------------
output_formats:
  - pem  # Concatenated PEM file (always on)
  - p7b  # PKCS#7 DER (.p7b)
  - jks  # Java KeyStore (.jks)
  - p12  # PKCS#12 (.p12)
# ---------------------------------------------------------------------
# Packaging behavior
# ---------------------------------------------------------------------
package: false  # Do not create .tar.gz by default (env/bundle may override)
# ---------------------------------------------------------------------
# Default per-format overrides (non-sensitive defaults only)
# ---------------------------------------------------------------------
format_overrides:
  jks:
    alias_format: '{subject.CN}-{serial}'  # Default alias template for JKS imports
  pkcs12:
    filename: default-ca-bundle.p12  # Default filename if not overridden
  pem:
    include_subject_comments: true  # Reinforces default PEM annotation setting
# ---------------------------------------------------------------------
# Optional metadata
# ---------------------------------------------------------------------
metadata:
  maintainer: pki-team@example.com  # Default contact for repository maintainers
  policy_version: 1.0  # Schema version tracking for config evolution
