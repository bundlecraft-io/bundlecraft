[project]
name = "bundlecraft"
version = "0.1.0"
description = "Unified CLI for building, verifying, and converting CA trust bundles."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Chris Pich" }]
dependencies = [
  "click>=8.0",
  "cryptography>=42.0",
  "pyOpenSSL>=23.0",
]

[project.optional-dependencies]
dev = [
"pytest>=8.0.0",
"black>=24.0.0",
"ruff>=0.14.0",
"build>=1.2.2",
"twine>=5.0.0",
]

[project.scripts]
bundlecraft = "bundlecraft.cli:cli"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bundlecraft*"]

[tool.ruff]
target-version = "py311"
line-length = 88
fix = true
unsafe-fixes = false

# Exclude common non-source directories
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "venv",
    ".venv",
    "testing",
]

# Enable all the core linting rules plus a few extras for code quality
lint.select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "B",  # flake8-bugbear
    "I",  # import sorting
    "UP", # pyupgrade (modernize syntax)
]

# Ignore noise that conflicts with Black
lint.ignore = ["E501"]  # line length handled by Black
