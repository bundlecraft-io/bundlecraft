name: ✅ Verify Trust Store Bundles

on:
  workflow_run:
    workflows: ["🏗️ Build Trust Store Bundles"]
    types:
      - completed

jobs:
  verify:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: 📥 Download combined artifact (all builds)
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: "build.yml"             # name or file of the workflow to fetch from
          workflow_conclusion: success
          name: all-builds                  # artifact name created in build.yml
          path: pki-ca-trust/
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📥 Download tarball artifact
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: "build.yml"
          workflow_conclusion: success
          name: truststore-bundle
          path: verify-tarball/
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧾 Ensure verify script executable
        run: chmod +x ./scripts/verify_bundle.py

      - name: 🔍 Verify unified directory
        run: |
          echo "Verifying full combined trust store tree (directory)"
          python ./scripts/verify_bundle.py pki-ca-trust/ --verbose

      - name: 🗜️ Extract and verify tarball
        run: |
          cd verify-tarball
          echo "Extracting truststore_bundle.tar.gz..."
          tar -xzf truststore_bundle.tar.gz
          echo "Extraction complete."
          echo "=== Extracted contents ==="
          tree pki-ca-trust/ || find pki-ca-trust/
          echo "=========================="
          cd ..

          echo "Verifying extracted tarball contents..."
          python ./scripts/verify_bundle.py verify-tarball/pki-ca-trust/ --verbose
