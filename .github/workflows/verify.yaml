name: ✅ Verify Trust Store Bundles

on:
  workflow_run:
    workflows: ["🏗️ Build Trust Store Bundles"]
    types:
      - completed

jobs:
  discover:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      bundles: ${{ steps.detect.outputs.bundles }}
      envs: ${{ steps.detect.outputs.envs }}
    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: 🔍 Detect bundles and environments
        id: detect
        run: |
          bundles=$(find config/bundles -type f -name "*.yaml" ! -name "example*.yaml" -exec basename {} .yaml \; | jq -R -s -c 'split("\n")[:-1]')
          envs=$(find config/envs -type f -name "*.yaml" ! -name "example*.yaml" -exec basename {} .yaml \; | jq -R -s -c 'split("\n")[:-1]')
          echo "bundles=$bundles" >> $GITHUB_OUTPUT
          echo "envs=$envs" >> $GITHUB_OUTPUT

  verify:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bundle: ${{ fromJson(needs.discover.outputs.bundles) }}
        env: ${{ fromJson(needs.discover.outputs.envs) }}

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: 📥 Download bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: trust-store-${{ matrix.env }}-${{ matrix.bundle }}
          path: pki-ca-trust/${{ matrix.env }}/${{ matrix.bundle }}/

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧾 Ensure verify script executable
        run: chmod +x ./scripts/verify_bundle.py

      - name: 🔍 Verify bundle
        run: |
          echo "Verifying bundle: ${{ matrix.bundle }} (env: ${{ matrix.env }})"
          python ./scripts/verify_bundle.py \
            pki-ca-trust/${{ matrix.env }}/${{ matrix.bundle }}/ \
            --verify-all --verbose

  verify-all:
    needs: verify
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: 📥 Download combined artifact (directory)
        uses: actions/download-artifact@v4
        with:
          name: all-builds
          path: pki-ca-trust/

      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔎 Verify unified directory
        run: |
          echo "Verifying full combined trust store tree (directory)"
          python ./scripts/verify_bundle.py pki-ca-trust/ --verbose

  verify-tarball:
    needs: verify-all
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: 📥 Download tarball artifact
        uses: actions/download-artifact@v4
        with:
          name: truststore-bundle
          path: verify-tarball/

      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🗜️ Extract tarball
        run: |
          cd verify-tarball
          echo "Extracting truststore_bundle.tar.gz..."
          tar -xzf truststore_bundle.tar.gz
          echo "Extraction complete."
          echo "=== Extracted contents ==="
          tree pki-ca-trust/ || find pki-ca-trust/
          echo "=========================="
          cd ..

      - name: 🔍 Verify extracted tarball
        run: |
          echo "Verifying truststore_bundle.tar.gz contents"
          python ./scripts/verify_bundle.py verify-tarball/pki-ca-trust/ --verbose
