name: ✅ Verify Trust Store Bundles

on:
  workflow_run:
    workflows: ["🏗️ Build Trust Store Bundles"]
    types:
      - completed

jobs:
  discover:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      bundles: ${{ steps.detect.outputs.bundles }}
      envs: ${{ steps.detect.outputs.envs }}
    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: 🔍 Detect available bundles and environments
        id: detect
        run: |
          bundles=$(find config/bundles -type f -name "*.yaml" -exec basename {} .yaml \; | jq -R -s -c 'split("\n")[:-1]')
          envs=$(find config/envs -type f -name "*.yaml" -exec basename {} .yaml \; | jq -R -s -c 'split("\n")[:-1]')
          echo "bundles=$bundles" >> $GITHUB_OUTPUT
          echo "envs=$envs" >> $GITHUB_OUTPUT

  verify:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bundle: ${{ fromJson(needs.discover.outputs.bundles) }}
        env: ${{ fromJson(needs.discover.outputs.envs) }}

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: 📥 Download built artifact
        uses: actions/download-artifact@v4
        with:
          name: trust-store-${{ matrix.env }}-${{ matrix.bundle }}
          path: build/${{ matrix.env }}/${{ matrix.bundle }}/

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔍 Verify bundle
        run: |
          echo "Verifying bundle: ${{ matrix.bundle }} for environment: ${{ matrix.env }}"
          ./scripts/verify_bundle.py build/${{ matrix.env }}/${{ matrix.bundle }}/ --verify-all --verbose
