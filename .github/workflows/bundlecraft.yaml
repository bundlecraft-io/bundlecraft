---
name: BundleCraft CA Trust Pipeline
run-name: 'BundleCraft CA Trust Pipeline - ${{ github.ref_name }} - Run #${{ github.run_number }}'
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  discover:
    name: Discover environment targets
    runs-on: ubuntu-latest
    outputs:
      env_targets: ${{ steps.detect.outputs.env_targets }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyYAML
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
      - name: Detect environment targets
        id: detect
        run: |
          set -euo pipefail
          python scripts/detect_env_targets.py | tee env_targets.json
          echo "env_targets=$(cat env_targets.json)" >> "$GITHUB_OUTPUT"
  build:
    name: Build per environment target
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJson(needs.discover.outputs.env_targets) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Build bundle target
        run: |
          echo "Building target: ${{ matrix.item.target }} in environment: ${{ matrix.item.env }}"
          bundlecraft build \
            --env ${{ matrix.item.env }} \
            --bundle ${{ matrix.item.target }} \
            --prefetch \
            --output-root "${{ matrix.item.output_root }}" \
            --package
      - name: Show output directory structure
        run: |
          echo "=== output directory structure ==="
          (tree "${{ matrix.item.output_root }}/" || find "${{ matrix.item.output_root }}/") || true
          echo "=================================="
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: trust-store-${{ matrix.item.env }}-${{ matrix.item.target }}
          path: ${{ matrix.item.output_root }}/${{ matrix.item.env }}/${{ matrix.item.target
            }}/
  collect:
    name: Collect and package all builds
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
      - name: Rehydrate to pki-ca-trust/<env>/<bundle> and package
        run: |
          set -euo pipefail
          echo "=== Contents of dist/ after artifact download ==="
          find dist -maxdepth 3 -type d || true
          echo "=================================================="
          rm -rf pki-ca-trust
          mkdir -p pki-ca-trust
          shopt -s nullglob dotglob
          for artifact_dir in dist/*; do
            base="$(basename "$artifact_dir")"
            if [[ "$base" =~ ^trust-store-([^-/]+)-(.+)$ ]]; then
              env="${BASH_REMATCH[1]}"
              bundle="${BASH_REMATCH[2]}"
              dest="pki-ca-trust/${env}/${bundle}"
              mkdir -p "$dest"
              cp -R "${artifact_dir}/"* "$dest"/ || true
              echo "Rehydrated: $base -> $dest"
            else
              echo "Skipping unexpected artifact dir name: $base"
            fi
          done
          shopt -u nullglob dotglob
          echo "=== pki-ca-trust (rehydrated) ==="
          find pki-ca-trust -maxdepth 3 -type d || true
          echo "================================="
          tar -czf truststore_bundle.tar.gz pki-ca-trust/
          sha256sum truststore_bundle.tar.gz > truststore_bundle.sha256
          echo "Created tarball and checksum:"
          sha256sum truststore_bundle.tar.gz
      - name: Upload combined directory
        uses: actions/upload-artifact@v4
        with:
          name: all-builds
          path: pki-ca-trust/
      - name: Upload tarball + checksum
        uses: actions/upload-artifact@v4
        with:
          name: truststore-bundle
          path: |
            truststore_bundle.tar.gz
            truststore_bundle.sha256
  verify:
    name: Verify builds and tarball
    needs: collect
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download all-builds artifact
        uses: actions/download-artifact@v4
        with:
          name: all-builds
          path: pki-ca-trust/
      - name: Download tarball artifact
        uses: actions/download-artifact@v4
        with:
          name: truststore-bundle
          path: verify-tarball/
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Verify combined directory
        run: |
          echo "=== Directory structure before verify ==="
          find pki-ca-trust -maxdepth 3 -type d || true
          echo "========================================"
          dirs=$(find pki-ca-trust -mindepth 2 -maxdepth 2 -type d)
          if [ -z "$dirs" ]; then
            echo "No bundle directories found under pki-ca-trust/. Check collect stage output."
            exit 1
          fi
          for dir in $dirs; do
            echo "Verifying $dir"
            bundlecraft verify --target "$dir" --verbose
          done
      - name: Extract and verify tarball
        run: |
          cd verify-tarball
          echo "Extracting truststore_bundle.tar.gz..."
          tar -xzf truststore_bundle.tar.gz
          echo "=== Extracted contents ==="
          find . -maxdepth 3 -type d || true
          echo "=========================="
          cd ..
          dirs=$(find verify-tarball/pki-ca-trust -mindepth 2 -maxdepth 2 -type d 2>/dev/null)
          if [ -z "$dirs" ]; then
            echo "No bundle directories found in extracted tarball."
            exit 1
          fi
          for dir in $dirs; do
            echo "Verifying $dir"
            bundlecraft verify --target "$dir" --verbose
          done
      - name: Summarize verified bundles
        if: success()
        run: |
          echo "=== Verification Summary ==="
          count=$(find pki-ca-trust -type f -name 'checksums.sha256' | wc -l)
          echo "Verified $count bundles:"
          find pki-ca-trust -type f -name 'checksums.sha256' -exec dirname {} \; | sort
          echo "==============================="
  publish-release:
    name: Publish GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    if: success()
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: truststore-bundle
          path: release/
      - name: Generate release tag and name
        id: version
        run: |
          DATE=$(date -u +"%Y.%m.%d-%H%M")
          echo "tag=truststore-v${DATE}" >> $GITHUB_OUTPUT
          echo "name=BundleCraft CA Trust Store Build - ${DATE}" >> $GITHUB_OUTPUT
      - name: Check if GPG key is available
        id: gpg-check
        shell: bash
        run: |
          if [ "${{ secrets.GPG_PRIVATE_KEY }}" != '' ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
          fi
      - name: Import GPG key for signing
        if: ${{ steps.gpg-check.outputs.available == 'true' }}
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Sign artifact
        if: ${{ steps.gpg-check.outputs.available == 'true' }}
        run: |
          gpg --armor --detach-sign release/truststore_bundle.tar.gz
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          body: |
            BundleCraft Trust Store Release
            - Build: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - Branch: `${{ github.ref_name }}`
            - Commit: `${{ github.sha }}`
            - Triggered by: @${{ github.actor }})
            - Signing: ${{ steps.gpg-check.outputs.available == 'true' && 'Enabled (signature attached)' || 'Disabled' }}
            ---
            Verification Instructions
            curl -O https://raw.githubusercontent.com/chrisjpich/bundlecraft/main/docs/public-gpg-key.asc
            gpg --import public-gpg-key.asc
            gpg --verify truststore_bundle.tar.gz.asc truststore_bundle.tar.gz
            ---
            If you do not see 'Good signature', the artifact may be tampered with.
          files: |-
            release/truststore_bundle.tar.gz
            release/truststore_bundle.sha256
            release/truststore_bundle.tar.gz.asc
