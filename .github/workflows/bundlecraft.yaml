---
name: 🧱 BundleCraft CA Trust Pipeline
run-name: 'BundleCraft CA Trust Pipeline - ${{ github.ref_name }} - Run #${{ github.run_number }}'
on:
  workflow_dispatch:
    inputs:
      environments:
        description: Comma-separated environments to build (leave blank to build all)
        required: false
        default: ''
concurrency:
  group: ${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  discover:
    name: Discover environment bundles
    runs-on: ubuntu-latest
    outputs:
      env_bundles: ${{ steps.detect.outputs.env_bundles }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyYAML
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
      - name: Detect environment bundles
        id: detect
        env:
          INPUT_ENVIRONMENTS: ${{ github.event.inputs.environments }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_ENVIRONMENTS:-}" ]; then
            python scripts/detect_env_targets.py --envs "${INPUT_ENVIRONMENTS}" --github-release-only | tee env_bundles.json
          else
            python scripts/detect_env_targets.py --github-release-only | tee env_bundles.json
          fi
          echo "env_bundles=$(cat env_bundles.json)" >> "$GITHUB_OUTPUT"
      - name: Summarize selection and validate
        env:
          INPUT_ENVIRONMENTS: ${{ github.event.inputs.environments }}
        run: |
          set -euo pipefail
          # Ensure jq is available (present on ubuntu-latest, but guard just in case)
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi
          ALL_JSON=$(python scripts/detect_env_targets.py)
          FILTERED_JSON=$(cat env_bundles.json)
          ALL_ENVS_FILE=$(mktemp)
          echo "$ALL_JSON" | jq -r '.[].env' | sort -u > "$ALL_ENVS_FILE"
          FILTERED_ENVS=$(echo "$FILTERED_JSON" | jq -r '.[].env' | sort -u | paste -sd ', ' - || true)
          TARGETS_COUNT=$(echo "$FILTERED_JSON" | jq 'length')

          # Parse selected environments (comma-separated), trim spaces, unique + sorted
          declare -A SEL_MAP=()
          if [ -n "${INPUT_ENVIRONMENTS:-}" ]; then
            IFS=',' read -ra RAW_SEL <<< "${INPUT_ENVIRONMENTS}"
            for raw in "${RAW_SEL[@]}"; do
              env=$(echo "$raw" | xargs)
              if [ -n "$env" ]; then SEL_MAP["$env"]=1; fi
            done
          fi
          SELECTED_SORTED=$(printf '%s\n' "${!SEL_MAP[@]}" | sort -u | paste -sd ', ' - || true)
          # Compute missing = selected - all
          MISSING=$(comm -23 <(printf '%s\n' "${!SEL_MAP[@]}" | sort -u) "$ALL_ENVS_FILE" | paste -sd ', ' - || true)
          echo '::group::BundleCraft selection summary'
          echo "Selected environments: ${SELECTED_SORTED:-'(all)'}"
          echo -n "Available environments: "
          paste -sd ', ' "$ALL_ENVS_FILE" || echo '(none)'
          echo "Filtered environments: ${FILTERED_ENVS:-'(none)'}"
          echo "Bundles count: ${TARGETS_COUNT}"
          echo '::endgroup::'
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo '## Build selection'
              echo
              echo "- Selected environments: ${SELECTED_SORTED:-'(all)'}"
              echo -n "- Available environments: "
              paste -sd ', ' "$ALL_ENVS_FILE" || echo '(none)'
              echo "- Filtered environments: ${FILTERED_ENVS:-'(none)'}"
              echo "- Bundles count: ${TARGETS_COUNT}"
              if [ "$TARGETS_COUNT" -gt 0 ]; then
                echo
                echo '### Bundles'
                echo "$FILTERED_JSON" | jq -r '.[] | "- \(.env)/\(.bundle)"'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "${SELECTED_SORTED}" ] && [ -n "$MISSING" ]; then
            echo "::error::Unknown environment(s): $MISSING" >&2
            exit 2
          fi
          if [ -n "${SELECTED_SORTED}" ] && [ "$TARGETS_COUNT" -eq 0 ]; then
            echo "::error::No bundles found for the selected environments." >&2
            exit 2
          fi
  build:
    name: Build per environment bundle
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJson(needs.discover.outputs.env_bundles) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Build bundle
        run: |
          echo "Building bundle: ${{ matrix.item.bundle }} in env: ${{ matrix.item.env }}"
          bundlecraft build \
            --env ${{ matrix.item.env }} \
            --bundle ${{ matrix.item.bundle }} \
            --output-root "${{ matrix.item.output_root }}" \
            --verbose --json
      - name: Show output directory structure
        run: |
          echo "=== output directory structure ==="
          (tree "${{ matrix.item.output_root }}/" || find "${{ matrix.item.output_root }}/") || true
          echo "=================================="
      - name: Validate build output exists
        run: |
          set -euo pipefail
          shopt -s nullglob
          matches=("${{ matrix.item.output_root }}"/*/"${{ matrix.item.bundle }}")
          if [ ${#matches[@]} -eq 0 ]; then
            echo "::error::No build output found at ${{ matrix.item.output_root }}/*/${{ matrix.item.bundle }}/"
            exit 1
          fi
          echo "Found build output: ${matches[0]}"
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: trust-store-${{ matrix.item.env }}-${{ matrix.item.bundle }}
          path: ${{ matrix.item.output_root }}/*/${{ matrix.item.bundle }}/
          if-no-files-found: error
  collect:
    name: Collect and package all builds
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
      - name: Rehydrate to bundlecraft/<env>/<bundle> and package
        run: |
          set -euo pipefail
          echo "=== Contents of dist/ after artifact download ==="
          ls -laR dist/ || true
          echo "=================================================="
          rm -rf bundlecraft
          mkdir -p bundlecraft
          shopt -s nullglob dotglob
          artifact_count=0
          for artifact_dir in dist/*; do
            [ -d "$artifact_dir" ] || continue
            artifact_count=$((artifact_count + 1))
            base="$(basename "$artifact_dir")"
            if [[ "$base" =~ ^trust-store-([^-/]+)-(.+)$ ]]; then
              env="${BASH_REMATCH[1]}"
              bundle="${BASH_REMATCH[2]}"
              dest="bundlecraft/${env}/${bundle}"
              mkdir -p "$dest"

              # Detect nested layout: artifact may contain env-dir/bundle-dir structure
              # Look for subdirectories matching the bundle name
              shopt -s nullglob
              nested_sources=("${artifact_dir}"/*/"${bundle}")
              if [ ${#nested_sources[@]} -gt 0 ] && [ -d "${nested_sources[0]}" ]; then
                # Found nested structure: copy from env-dir/bundle-dir
                echo "  Detected nested layout; copying from: ${nested_sources[0]}"
                cp -R "${nested_sources[0]}/"* "$dest"/ || true
              else
                # Flat structure or direct bundle content: copy from artifact root
                cp -R "${artifact_dir}/"* "$dest"/ || true
              fi
              shopt -u nullglob
              echo "✓ Rehydrated: $base -> $dest"
            else
              echo "⚠ Skipping unexpected artifact dir name: $base"
            fi
          done
          shopt -u nullglob dotglob
          if [ $artifact_count -eq 0 ]; then
            echo "::error::No artifacts were downloaded"
            exit 1
          fi
          echo "=== bundlecraft (rehydrated) ==="
          find bundlecraft -maxdepth 3 -type d || true
          echo "================================="
          tar -czf bundlecraft-trust.tar.gz bundlecraft/
          sha256sum bundlecraft-trust.tar.gz > bundlecraft-trust.sha256
          echo "Created tarball and checksum:"
          sha256sum bundlecraft-trust.tar.gz
          echo "=== Creating per-env-bundle tarballs (flat contents) ==="
          mapfile -t BUNDLES < <(find bundlecraft -mindepth 2 -maxdepth 2 -type d | sort)
          for dir in "${BUNDLES[@]}"; do
            env="$(echo "$dir" | awk -F/ '{print $2}')"
            bundle="$(echo "$dir" | awk -F/ '{print $3}')"
            name="bundlecraft-trust-env-${env}-bundle-${bundle}.tar.gz"
            # Create a flat tarball with the contents of the bundle at the archive root
            tar -czf "$name" -C "bundlecraft/${env}/${bundle}" .
            sha256sum "$name" > "${name%.tar.gz}.sha256"
            echo "Created per-bundle tarball: $name"
          done
      - name: Upload combined directory
        uses: actions/upload-artifact@v4
        with:
          name: all-builds
          path: bundlecraft/
      - name: Upload tarball + checksum
        uses: actions/upload-artifact@v4
        with:
          name: truststore-bundle
          path: |
            bundlecraft-trust.tar.gz
            bundlecraft-trust.sha256
      - name: Upload per-bundle tarballs
        uses: actions/upload-artifact@v4
        with:
          name: truststore-bundles
          path: |
            bundlecraft-trust-env-*-bundle-*.tar.gz
            bundlecraft-trust-env-*-bundle-*.sha256
  verify:
    name: Verify builds and tarball
    needs: collect
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download all-builds artifact
        uses: actions/download-artifact@v4
        with:
          name: all-builds
          path: bundlecraft/
      - name: Download tarball artifact
        uses: actions/download-artifact@v4
        with:
          name: truststore-bundle
          path: verify-tarball/
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Verify combined directory
        run: |
          echo "=== Directory structure before verify ==="
          find bundlecraft -maxdepth 3 -type d || true
          echo "========================================"
          dirs=$(find bundlecraft -mindepth 2 -maxdepth 2 -type d)
          if [ -z "$dirs" ]; then
            echo "No bundle directories found under bundlecraft/. Check collect stage output."
            exit 1
          fi
          for dir in $dirs; do
            echo "Verifying $dir"
            bundlecraft verify --target "$dir" --verbose --json
          done
      - name: Extract and verify tarball
        run: |
          cd verify-tarball
          echo "Extracting bundlecraft-trust.tar.gz..."
          tar -xzf bundlecraft-trust.tar.gz
          echo "=== Extracted contents ==="
          find . -maxdepth 3 -type d || true
          echo "=========================="
          cd ..
          dirs=$(find verify-tarball/bundlecraft -mindepth 2 -maxdepth 2 -type d 2>/dev/null)
          if [ -z "$dirs" ]; then
            echo "No bundle directories found in extracted tarball."
            exit 1
          fi
          for dir in $dirs; do
            echo "Verifying $dir"
            bundlecraft verify --target "$dir" --verbose --json
          done
      - name: Summarize verified bundles
        if: success()
        run: |
          echo "=== Verification Summary ==="
          count=$(find bundlecraft -type f -name 'checksums.sha256' | wc -l)
          echo "Verified $count bundles:"
          find bundlecraft -type f -name 'checksums.sha256' -exec dirname {} \; | sort
          echo "==============================="
  publish-release:
    name: Publish GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    if: success()
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: truststore-bundle
          path: release/
      - name: Download per-bundle artifacts
        uses: actions/download-artifact@v4
        with:
          name: truststore-bundles
          path: release/
      - name: Generate release tag and name
        id: version
        run: |
          DATE=$(date -u +"%Y.%m.%d-%H%M")
          echo "tag=bundlecraft-truststore-v${DATE}" >> $GITHUB_OUTPUT
          echo "name=BundleCraft CA Trust Store - ${DATE}" >> $GITHUB_OUTPUT
      - name: Check if GPG key is available
        id: gpg-check
        shell: bash
        run: |
          if [ "${{ secrets.GPG_PRIVATE_KEY }}" != '' ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
          fi
      - name: Import GPG key for signing
        if: ${{ steps.gpg-check.outputs.available == 'true' }}
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Sign artifact
        if: ${{ steps.gpg-check.outputs.available == 'true' }}
        run: |
          gpg --armor --detach-sign release/bundlecraft-trust.tar.gz
      - name: Summarize bundles in tarball
        id: summary
        shell: bash
        run: |
          set -euo pipefail
          TAR="release/bundlecraft-trust.tar.gz"
          if [ ! -f "$TAR" ]; then
            echo "Tarball not found: $TAR" >&2
            exit 1
          fi
          # Find unique bundlecraft/<env>/<bundle>/ directories inside the tarball
          mapfile -t DIRS < <(tar -tzf "$TAR" | awk -F/ 'NF>=3 {print $1"/"$2"/"$3"/"}' | sort -u)
          mapfile -t BUNDLES < <(printf "%s\n" "${DIRS[@]}" | grep -E '^bundlecraft/[^/]+/[^/]+/$' | sed -E 's#^bundlecraft/([^/]+)/([^/]+)/$#\1/\2#' | sort)
          count=${#BUNDLES[@]}
          echo "bundle_count=$count" >> "$GITHUB_OUTPUT"
          {
            echo "bundle_list<<EOF"
            for b in "${BUNDLES[@]}"; do
              echo "$b"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          {
            echo "bundle_list_markdown<<EOF"
            for b in "${BUNDLES[@]}"; do
              echo "- $b"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Setup Python for trust matrix
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyYAML for trust matrix
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
      - name: Generate trust matrix artifacts
        run: |
          python scripts/trust_matrix.py --config-dir config --format markdown --output release/TRUST_MATRIX.md
          python scripts/trust_matrix.py --config-dir config --format json --output release/trust-matrix.json
          echo "Generated trust matrix:"
          ls -l release/TRUST_MATRIX.md release/trust-matrix.json
      - name: Generate asset links (sizes + sha256)
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          TAG='${{ steps.version.outputs.tag }}'
          BASE_URL='${{ github.server_url }}/${{ github.repository }}/releases/download/'"$TAG"
          has_numfmt=0
          if command -v numfmt >/dev/null 2>&1; then has_numfmt=1; fi
          human() {
            if [ $has_numfmt -eq 1 ]; then
              numfmt --to=iec --suffix=B "$1"
            else
              echo "$1 bytes"
            fi
          }
          combined_md=""
          if [ -f release/bundlecraft-trust.tar.gz ]; then
            bytes=$(stat -c %s release/bundlecraft-trust.tar.gz)
            size=$(human "$bytes")
            sha=$(cut -d ' ' -f1 release/bundlecraft-trust.sha256 || true)
            combined_md+="- [bundlecraft-trust.tar.gz](${BASE_URL}/bundlecraft-trust.tar.gz) - ${size} - sha256: ${sha}\n"
            if [ -f release/bundlecraft-trust.tar.gz.asc ]; then
              sig_bytes=$(stat -c %s release/bundlecraft-trust.tar.gz.asc)
              sig_size=$(human "$sig_bytes")
              combined_md+="  - Signature: [bundlecraft-trust.tar.gz.asc](${BASE_URL}/bundlecraft-trust.tar.gz.asc) - ${sig_size}\n"
            fi
          else
            combined_md="(none)\n"
          fi
          perenv_md=""
          shopt -s nullglob
          files=(release/bundlecraft-trust-env-*-bundle-*.tar.gz)
          if [ ${#files[@]} -eq 0 ]; then
            perenv_md="(none)\n"
          else
            for f in "${files[@]}"; do
              name=$(basename "$f")
              bytes=$(stat -c %s "$f")
              size=$(human "$bytes")
              sha_file="${f%.tar.gz}.sha256"
              sha=""
              if [ -f "$sha_file" ]; then sha=$(cut -d ' ' -f1 "$sha_file"); fi
              perenv_md+="- [${name}](${BASE_URL}/${name}) - ${size} - sha256: ${sha}\n"
            done
          fi
          {
            echo "assets_combined_markdown<<EOF"
            printf "%b" "$combined_md"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          {
            echo "assets_perenv_markdown<<EOF"
            printf "%b" "$perenv_md"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          # Emit raw SHA256 lines for combined and per-env, for a fenced block in the release body
          sha_lines=""
          if [ -f release/bundlecraft-trust.sha256 ]; then
            sha_lines+=$(cat release/bundlecraft-trust.sha256)
            sha_lines+=$'\n'
          fi
          for s in release/bundlecraft-trust-env-*-bundle-*.sha256; do
            [ -f "$s" ] || continue
            sha_lines+=$(cat "$s")
            sha_lines+=$'\n'
          done
          {
            echo "assets_hashes_lines<<EOF"
            printf "%b" "$sha_lines"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Summarize per-bundle assets
        id: percraft
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release/bundlecraft-trust-env-*-bundle-*.tar.gz)
          if [ ${#files[@]} -eq 0 ]; then
            echo "craft_count=0" >> "$GITHUB_OUTPUT"
            {
              echo "craft_list_markdown<<EOF"
              echo "(none)"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mapfile -t PAIRS < <(printf "%s\n" "${files[@]}" | sed -E 's#^.*/bundlecraft-trust-env-([^/]+)-bundle-(.+)\.tar\.gz$#\1/\2#' | sort)
          count=${#PAIRS[@]}
          echo "craft_count=$count" >> "$GITHUB_OUTPUT"
          {
            echo "craft_list_markdown<<EOF"
            for p in "${PAIRS[@]}"; do
              env="${p%%/*}"; bundle="${p#*/}"
              echo "- ${env}/${bundle} (bundlecraft-trust-env-${env}-bundle-${bundle}.tar.gz)"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release (signed)
        if: ${{ steps.gpg-check.outputs.available == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          body: |
            ## BundleCraft Trust Store Release

            ### Build metadata
            - Build: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - Branch: `${{ github.ref_name }}`
            - Commit: `${{ github.sha }}`
            - Triggered by: @${{ github.actor }}
            - Signing: Enabled (signature attached)

            ### Bundles built (${{ steps.summary.outputs.bundle_count }})
            ${{ steps.summary.outputs.bundle_list_markdown }}

            ### Download assets
            - Combined (all envs):
            ${{ steps.assets.outputs.assets_combined_markdown }}
            - Per-env/bundle assets:
            ${{ steps.assets.outputs.assets_perenv_markdown }}

            ### SHA256 checksums
            ```text
            ${{ steps.assets.outputs.assets_hashes_lines }}
            ```

            ### What’s included in each bundle
            - Canonical PEM bundle (.pem)
            - Additional formats when configured (.p7b, .p12, .jks)
            - checksums.sha256
            - manifest.json
            - sbom.json (Software Bill of Materials in CycloneDX format)

            ### Verification Instructions
            **Verify GPG signature:**
            ```bash
            # Download and import the public GPG key
            curl -O https://raw.githubusercontent.com/bundlecraft-io/bundlecraft/main/docs/public-gpg-key.asc
            gpg --import public-gpg-key.asc

            # Verify the signature
            gpg --verify bundlecraft-trust.tar.gz.asc bundlecraft-trust.tar.gz
            ```
            ✅ If you see 'Good signature', the artifact is authentic and untampered.
            ❌ If verification fails, do not use the artifact.
            **Verify using BundleCraft CLI:**
            ```bash
            # Verify all signatures in a bundle directory
            bundlecraft verify --target <bundle-dir> --verify-signatures

            # Or with a specific keyring
            bundlecraft verify --target <bundle-dir> \
              --verify-signatures --gpg-keyring public-gpg-key.asc
            ```
            **SBOM (Software Bill of Materials):**
            Each bundle includes an sbom.json file containing:
            - Certificate metadata (serial, issuer, subject, fingerprints)
            - Fetch provenance (source URLs, verification hashes)
            - Tooling metadata (Python version, cryptography version)
            - Build metadata (env, bundle, timestamp)

            ### Consumers: quick start
            Per-env/bundle archive (recommended for targeted usage):
            ```bash
            # Verify checksum
            sha256sum -c bundlecraft-trust-env-<env>-bundle-<bundle>.sha256

            # Extract (flat contents at archive root)
            tar -xzf bundlecraft-trust-env-<env>-bundle-<bundle>.tar.gz

            # Access bundle files
            ls -la
            ```
            Combined bundle (all envs and bundles):
            ```bash
            # Verify checksum and signature (if provided)
            sha256sum -c bundlecraft-trust.sha256
            gpg --verify bundlecraft-trust.tar.gz.asc bundlecraft-trust.tar.gz

            # Extract (creates bundlecraft/ directory)
            tar -xzf bundlecraft-trust.tar.gz

            # Explore structure
            ls -R bundlecraft/
            ```
          files: |-
            release/bundlecraft-trust.tar.gz
            release/bundlecraft-trust.sha256
            release/bundlecraft-trust.tar.gz.asc
            release/bundlecraft-trust-env-*-bundle-*.tar.gz
            release/bundlecraft-trust-env-*-bundle-*.sha256
            release/TRUST_MATRIX.md
            release/trust-matrix.json
      - name: Create GitHub Release (unsigned)
        if: ${{ steps.gpg-check.outputs.available == 'false' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          body: |
            ## BundleCraft Trust Store Release

            ### Build metadata
            - Build: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - Branch: `${{ github.ref_name }}`
            - Commit: `${{ github.sha }}`
            - Triggered by: @${{ github.actor }}
            - Signing: Disabled

            ### Bundles built (${{ steps.summary.outputs.bundle_count }})
            ${{ steps.summary.outputs.bundle_list_markdown }}

            ### Download assets
            - Combined (all envs):
            ${{ steps.assets.outputs.assets_combined_markdown }}
            - Per-bundle:
            ${{ steps.assets.outputs.assets_perenv_markdown }}

            ### SHA256 checksums
            ```text
            ${{ steps.assets.outputs.assets_hashes_lines }}
            ```

            ### What’s included in each bundle
            - Canonical PEM bundle (.pem)
            - Additional formats when configured (.p7b, .p12, .jks)
            - checksums.sha256
            - manifest.json
            - sbom.json (Software Bill of Materials in CycloneDX format)

            ### SBOM (Software Bill of Materials)
            Each bundle includes an sbom.json file in CycloneDX format containing:
            - Certificate metadata (serial, issuer, subject, fingerprints)
            - Fetch provenance (source URLs, verification hashes)
            - Tooling metadata (Python version, cryptography version)
            - Build metadata (env, bundle, timestamp)

            ### Consumers: quick start
            Per-env-bundle (recommended for targeted usage):
            ```bash
            # Verify checksum
            sha256sum -c bundlecraft-trust-env-<env>-bundle-<bundle>.sha256

            # Extract (creates <env>/<bundle>/ directory structure)
            tar -xzf bundlecraft-trust-env-<env>-bundle-<bundle>.tar.gz

            # Access bundle files
            ls <env>/<bundle>/
            ```
            Combined bundle (all envs and bundles):
            ```bash
            # Verify checksum
            sha256sum -c bundlecraft-trust.sha256

            # Extract (creates bundlecraft/ directory)
            tar -xzf bundlecraft-trust.tar.gz

            # Explore structure
            ls -R bundlecraft/
            ```
          files: |-
            release/bundlecraft-trust.tar.gz
            release/bundlecraft-trust.sha256
            release/bundlecraft-trust-env-*-bundle-*.tar.gz
            release/bundlecraft-trust-env-*-bundle-*.sha256
            release/TRUST_MATRIX.md
            release/trust-matrix.json
            release/bundlecraft-trust-env-*-bundle-*.sha256
            release/TRUST_MATRIX.md
            release/trust-matrix.json
