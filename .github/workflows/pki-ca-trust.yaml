name: 🧱 PKI CA Trust Pipeline
run-name: Run ${{ github.run_number }} - By ${{ github.actor }} - On ${{ github.ref_name }}

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:

  # =========================================================
  #  STAGE 1: DISCOVER - Find all bundles and environments
  # =========================================================
  discover:
    runs-on: ubuntu-latest
    outputs:
      bundles: ${{ steps.detect.outputs.bundles }}
      envs: ${{ steps.detect.outputs.envs }}
    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: 🔍 Detect available bundles and environments
        id: detect
        run: |
          bundles=$(find config/bundles -type f -name "*.yaml" ! -name "example*.yaml" -exec basename {} .yaml \; | jq -R -s -c 'split("\n")[:-1]')
          envs=$(find config/envs -type f -name "*.yaml" ! -name "example*.yaml" -exec basename {} .yaml \; | jq -R -s -c 'split("\n")[:-1]')
          echo "Detected bundles: $bundles"
          echo "Detected environments: $envs"
          echo "bundles=$bundles" >> $GITHUB_OUTPUT
          echo "envs=$envs" >> $GITHUB_OUTPUT

  # =========================================================
  #  STAGE 2: BUILD - Build all bundles across environments
  # =========================================================
  build:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bundle: ${{ fromJson(needs.discover.outputs.bundles) }}
        env: ${{ fromJson(needs.discover.outputs.envs) }}

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧾 Ensure build script executable
        run: chmod +x ./scripts/build_trust_store.py

      - name: 🔨 Build bundle
        run: |
          echo "Building bundle: ${{ matrix.bundle }} in environment: ${{ matrix.env }}"
          python ./scripts/build_trust_store.py \
            --env ${{ matrix.env }} \
            --bundle ${{ matrix.bundle }} \
            --package

      - name: 🧱 Show directory structure
        run: |
          echo "=== build directory structure ==="
          tree build/ || find build/
          echo "================================="

      - name: 📦 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: trust-store-${{ matrix.env }}-${{ matrix.bundle }}
          path: build/${{ matrix.env }}/${{ matrix.bundle }}/

  # =========================================================
  #  STAGE 3: COLLECT - Merge all build outputs into one bundle
  # =========================================================
  collect:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: build/

      - name: 🗜️ Rehydrate to pki-ca-trust/<env>/<bundle> and package
        run: |
          set -euo pipefail
          echo "=== Contents of build/ after artifact download ==="
          find build -maxdepth 3 -type d || true
          echo "=================================================="

          # Rebuild canonical tree: pki-ca-trust/<env>/<bundle> from artifact names like trust-store-<env>-<bundle>
          rm -rf pki-ca-trust
          mkdir -p pki-ca-trust

          shopt -s nullglob dotglob
          for artifact_dir in build/*; do
            base="$(basename "$artifact_dir")"
            # Expect names like trust-store-prod-internal
            if [[ "$base" =~ ^trust-store-([^-/]+)-(.+)$ ]]; then
              env="${BASH_REMATCH[1]}"
              bundle="${BASH_REMATCH[2]}"
              dest="pki-ca-trust/${env}/${bundle}"
              mkdir -p "$dest"
              cp -R "${artifact_dir}/"* "$dest"/ || true
              echo "Rehydrated: $base -> $dest"
            else
              echo "Skipping unexpected artifact dir name: $base"
            fi
          done
          shopt -u nullglob dotglob

          echo "=== pki-ca-trust (rehydrated) ==="
          find pki-ca-trust -maxdepth 3 -type d || true
          echo "================================="

          # Create tarball with top-level pki-ca-trust/
          tar -czf truststore_bundle.tar.gz pki-ca-trust/
          sha256sum truststore_bundle.tar.gz > truststore_bundle.sha256
          echo "✅ Created tarball and checksum:"
          sha256sum truststore_bundle.tar.gz

      - name: 📦 Upload combined directory
        uses: actions/upload-artifact@v4
        with:
          name: all-builds
          path: pki-ca-trust/

      - name: 📦 Upload tarball + checksum
        uses: actions/upload-artifact@v4
        with:
          name: truststore-bundle
          path: |
            truststore_bundle.tar.gz
            truststore_bundle.sha256

  # =========================================================
  #  STAGE 4: VERIFY - Validate all outputs
  # =========================================================
  verify:
    needs: collect
    runs-on: ubuntu-latest
    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: 📥 Download all-builds artifact
        uses: actions/download-artifact@v4
        with:
          name: all-builds
          path: pki-ca-trust/

      - name: 📥 Download tarball artifact
        uses: actions/download-artifact@v4
        with:
          name: truststore-bundle
          path: verify-tarball/

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔍 Verify combined directory (with diagnostics)
        run: |
          echo "=== Directory structure before verify ==="
          find pki-ca-trust -maxdepth 3 -type d || true
          echo "========================================"

          dirs=$(find pki-ca-trust -type d -mindepth 2 -maxdepth 2)
          if [ -z "$dirs" ]; then
            echo "⚠️  No bundle directories found under pki-ca-trust/. Check collect stage output."
            exit 1
          fi

          for dir in $dirs; do
            echo "🔍 Verifying $dir"
            python ./scripts/verify_bundle.py "$dir" --verbose
          done

      - name: 🗜️ Extract and verify tarball (with diagnostics)
        run: |
          cd verify-tarball
          echo "Extracting truststore_bundle.tar.gz..."
          tar -xzf truststore_bundle.tar.gz
          echo "=== Extracted contents ==="
          find . -maxdepth 3 -type d || true
          echo "=========================="
          cd ..

          dirs=$(find verify-tarball/pki-ca-trust -type d -mindepth 2 -maxdepth 2 2>/dev/null)
          if [ -z "$dirs" ]; then
            echo "⚠️  No bundle directories found in extracted tarball."
            exit 1
          fi

          for dir in $dirs; do
            echo "🔍 Verifying $dir"
            python ./scripts/verify_bundle.py "$dir" --verbose
          done

  # =========================================================
  #  STAGE 5: PUBLISH GitHub Release 📦
  # =========================================================
  publish-release:
    needs: verify
    runs-on: ubuntu-latest
    if: success()
    permissions:
      contents: write   # required to create releases
    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: 📥 Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: truststore-bundle
          path: release/

      - name: 🧮 Generate release tag and name
        id: version
        run: |
          DATE=$(date -u +"%Y.%m.%d-%H%M")
          echo "tag=truststore-v${DATE}" >> $GITHUB_OUTPUT
          echo "name=Truststore Build - ${DATE}" >> $GITHUB_OUTPUT

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          body: |
            🔒 **PKI CA Trust Store Update**
            - Generated automatically from verified pipeline run #${{ github.run_number }}
            - Contains all environments and bundles
            - See attached artifacts for details.
          files: |
            release/truststore_bundle.tar.gz
            release/truststore_bundle.sha256
