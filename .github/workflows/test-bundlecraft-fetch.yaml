---
name: 🥏 BundleCraft Fetch Test Suite
run-name: 'BundleCraft Fetch Test Suite - Run #${{ github.run_number }}'
on:
  workflow_dispatch:
    inputs:
      test_types:
        description: Comma-separated list of test types to run (vault,http,api,s3,gcs,azure_blob).
          Leave blank to run all.
        required: false
        default: ''
jobs:
  vault-fetch:
    name: 'Test: Vault Fetcher (K/V v2 or v1)'
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event.inputs.test_types == '' || contains(github.event.inputs.test_types, 'vault') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install BundleCraft (with Vault fetcher)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,fetchers]"
      - name: Generate bundle config for Vault test (ci-test-vault.yaml)
        shell: bash
        run: |
          cat > ci-test-vault.yaml <<'YAML'
          source_name: ci-vault-test
          description: CI test bundle for Vault K/V fetcher validation
          fetch:
            - name: from_vault
              type: vault
              mount: secret
              path: pki/trusted_roots
              pem_field: pem
              addr: http://127.0.0.1:8200
              token_ref: VAULT_TOKEN
          YAML
          echo "Generated ci-test-vault.yaml:" && cat ci-test-vault.yaml
      - name: Ensure vault-local.py is executable
        run: chmod +x scripts/vault-local.py
      - name: Run local Vault and fetch via BundleCraft
        env:
          VAULT_ADDR: http://127.0.0.1:8200
          VAULT_TOKEN: root
        run: |
          ./scripts/vault-local.py up --verbose --runtime podman --ci-cmd "bundlecraft fetch --verbose --source-config-file ci-test-vault.yaml --json" || { echo "Vault CI command failed"; exit 1; }
      - name: Verify Vault fetch outputs
        run: |
          echo "Checking staged outputs:"
          test -f cert_sources/staged/ci-vault-test/fetch/from_vault/from_vault.pem || { echo "❌ Missing from_vault.pem"; exit 1; }
          test -f cert_sources/staged/ci-vault-test/fetch/from_vault/provenance.fetch.json || { echo "❌ Missing provenance"; exit 1; }
          echo "✅ Vault fetch successful"
      - name: Upload Vault job artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vault-fetch-artifacts
          path: |
            cert_sources/staged/ci-vault-test/**
            local_vault/**
            local_vault_artifacts/**
            ci-test-vault.yaml
  http-fetch:
    name: 'Test: HTTP Fetcher (Local Test Server with pinning)'
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event.inputs.test_types == '' || contains(github.event.inputs.test_types, 'http') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install BundleCraft and test server deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,fetchers]"
          pip install flask flasgger
      - name: Start local test server (HTTPS)
        run: |
          chmod +x scripts/test-server-local.py
          ./scripts/test-server-local.py up --port 8443 --token mock-token-12345
          # Wait for readiness
          for i in {1..30}; do
            if curl -sk https://127.0.0.1:8443/test-cert.pem >/dev/null; then echo "Server ready"; break; fi; sleep 1; done
          curl -sk https://127.0.0.1:8443/test-cert.pem >/dev/null || { echo "Server did not become ready"; exit 1; }
          echo "DATA_DIR=$(cat /tmp/test-server-local-latest)" >> "$GITHUB_ENV"
      - name: Prepare trust and generate HTTP fetch config (ci-test-http.yaml)
        run: |
          mkdir -p ci-http-test
          cp "$DATA_DIR/server.crt" ci-http-test/ca.crt
          CA_FILE="$(pwd)/ci-http-test/ca.crt"
          cat > ci-test-http.yaml <<YAML
          source_name: ci-http-test
          description: CI test bundle for HTTPS fetcher with TLS pinning
          fetch:
            - name: from_https
              type: url
              url: https://127.0.0.1:8443/test-cert.pem
              verify:
                ca_file: ${CA_FILE}
          YAML
          echo "Generated ci-test-http.yaml with CA trust"
      - name: Run HTTP fetch with pinning
        run: |
          bundlecraft fetch --verbose --source-config-file ci-test-http.yaml --json
      - name: Verify HTTP fetch outputs
        run: |
          echo "Checking staged outputs:"
          test -f cert_sources/staged/ci-http-test/fetch/from_https/from_https.pem || { echo "❌ Missing from_https.pem"; exit 1; }
          test -f cert_sources/staged/ci-http-test/fetch/from_https/provenance.fetch.json || { echo "❌ Missing provenance"; exit 1; }
          echo "✅ HTTP fetch with pinning successful"
      - name: HTTP job summary
        run: |
          echo "## HTTP fetcher" >> "$GITHUB_STEP_SUMMARY"
          echo "- Endpoint: https://127.0.0.1:8443/test-cert.pem" >> "$GITHUB_STEP_SUMMARY"
          echo "- Used CA file: ci-http-test/ca.crt" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: Success" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload HTTP job artifacts
        uses: actions/upload-artifact@v4
        with:
          name: http-fetch-artifacts
          path: |
            cert_sources/staged/ci-http-test/**
            ci-http-test/**
            ci-test-http.yaml
      - name: Cleanup
        if: always()
        run: |
          ./scripts/test-server-local.py down || true
  api-fetch:
    name: 'Test: API Fetcher (Local Test Server)'
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event.inputs.test_types == '' || contains(github.event.inputs.test_types, 'api') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install BundleCraft and test server deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,fetchers]"
          pip install flask flasgger
      - name: Start local API (test server)
        env:
          KEYFACTOR_TOKEN: ${{ secrets.KEYFACTOR_TOKEN }}
        run: |
          if [ -z "${KEYFACTOR_TOKEN:-}" ]; then KEYFACTOR_TOKEN=mock-token-12345; fi
          export KEYFACTOR_TOKEN
          chmod +x scripts/test-server-local.py
          ./scripts/test-server-local.py up --port 8443 --token "$KEYFACTOR_TOKEN"
          # Wait for readiness
          for i in {1..30}; do
            if curl -sk https://127.0.0.1:8443/test-cert.pem >/dev/null; then echo "Server ready"; break; fi; sleep 1; done
          curl -sk https://127.0.0.1:8443/test-cert.pem >/dev/null || { echo "Server did not become ready"; exit 1; }
          echo "DATA_DIR=$(cat /tmp/test-server-local-latest)" >> "$GITHUB_ENV"
      - name: Generate API fetch config (ci-test-api.yaml)
        env:
          KEYFACTOR_TOKEN: ${{ secrets.KEYFACTOR_TOKEN }}
        run: |
          if [ -z "${KEYFACTOR_TOKEN:-}" ]; then KEYFACTOR_TOKEN=mock-token-12345; fi
          export KEYFACTOR_TOKEN
          mkdir -p ci-api-test
          cp "$DATA_DIR/server.crt" ci-api-test/api.crt
          CA_FILE="$(pwd)/ci-api-test/api.crt"
          cat > ci-test-api.yaml <<YAML
          source_name: ci-api-test
          description: CI test bundle for API fetcher (Keyfactor mock)
          fetch:
            - name: from_keyfactor_mock
              type: api
              endpoint: https://127.0.0.1:8443/Certificates/Download
              provider: keyfactor
              token_ref: KEYFACTOR_TOKEN
              verify:
                ca_file: ${CA_FILE}
          YAML
          echo "Generated ci-test-api.yaml"
      - name: Run API fetch (redundant safety)
        env:
          KEYFACTOR_TOKEN: ${{ secrets.KEYFACTOR_TOKEN }}
        run: |
          if [ -z "${KEYFACTOR_TOKEN:-}" ]; then KEYFACTOR_TOKEN=mock-token-12345; fi
          export KEYFACTOR_TOKEN
          bundlecraft fetch --verbose --source-config-file ci-test-api.yaml --json
      - name: Verify API fetch outputs
        run: |-
          echo "Checking staged outputs:"
          test -f cert_sources/staged/ci-api-test/fetch/from_keyfactor_mock/from_keyfactor_mock.pem || { echo "❌ Missing from_keyfactor_mock.pem"; exit 1; }
          test -f cert_sources/staged/ci-api-test/fetch/from_keyfactor_mock/provenance.fetch.json || { echo "❌ Missing provenance"; exit 1; }
          echo "✅ API fetch (Keyfactor mock) successful"
      - name: API job summary
        run: |
          echo "## API fetcher" >> "$GITHUB_STEP_SUMMARY"
          echo "- Endpoint: https://127.0.0.1:8443/Certificates/Download" >> "$GITHUB_STEP_SUMMARY"
          echo "- Used CA file: ci-api-test/api.crt" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: Success" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload API job artifacts
        uses: actions/upload-artifact@v4
        with:
          name: api-fetch-artifacts
          path: |
            cert_sources/staged/ci-api-test/**
            ci-api-test/**
            ci-test-api.yaml
      - name: Cleanup
        if: always()
        run: |-
          ./scripts/test-server-local.py down || true
  s3-fetch:
    name: 'Test: S3 Fetcher (AWS S3)'
    runs-on: ubuntu-latest
    environment: cloud-tests
    permissions:
      contents: read
    if: >-
      ${{ github.event.inputs.test_types == '' || contains(github.event.inputs.test_types, 's3') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install BundleCraft (with S3 fetcher)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,fetchers]"
      - name: Generate bundle config for S3 test (ci-test-s3.yaml)
        env:
          S3_BUCKET: ${{ secrets.S3_TEST_BUCKET }}
          S3_OBJECT_KEY: ${{ secrets.S3_TEST_OBJECT_KEY }}
          S3_REGION: ${{ secrets.S3_TEST_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          # Check if required environment variables are set
          if [ -z "${S3_BUCKET:-}" ] || [ -z "${S3_OBJECT_KEY:-}" ]; then
            echo "::warning::S3 test skipped - required secrets S3_TEST_BUCKET or S3_TEST_OBJECT_KEY not configured"
            echo "SKIP_TEST=true" >> "$GITHUB_ENV"
            exit 0
          fi

          # Generate S3 test config
          cat > ci-test-s3.yaml <<YAML
          source_name: ci-s3-test
          description: CI test bundle for S3 fetcher validation
          fetch:
            - name: from_s3
              type: s3
              bucket: ${S3_BUCKET}
              key: ${S3_OBJECT_KEY}
          YAML

          # Add region if provided
          if [ -n "${S3_REGION:-}" ]; then
            echo "              region: ${S3_REGION}" >> ci-test-s3.yaml
          fi
          echo "Generated ci-test-s3.yaml:" && cat ci-test-s3.yaml
      - name: Run S3 fetch
        if: env.SKIP_TEST != 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          bundlecraft fetch --verbose --source-config-file ci-test-s3.yaml --json
      - name: Verify S3 fetch outputs
        if: env.SKIP_TEST != 'true'
        run: |
          echo "Checking staged outputs:"
          test -f cert_sources/staged/ci-s3-test/fetch/from_s3/from_s3.pem || { echo "❌ Missing from_s3.pem"; exit 1; }
          test -f cert_sources/staged/ci-s3-test/fetch/from_s3/provenance.fetch.json || { echo "❌ Missing provenance"; exit 1; }
          echo "✅ S3 fetch successful"
      - name: S3 job summary
        if: env.SKIP_TEST != 'true'
        run: |
          echo "## S3 fetcher" >> "$GITHUB_STEP_SUMMARY"
          echo "- Bucket: ${{ secrets.S3_TEST_BUCKET }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Object Key: ${{ secrets.S3_TEST_OBJECT_KEY }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Region: ${{ secrets.S3_TEST_REGION || 'default' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: Success" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload S3 job artifacts
        if: always() && env.SKIP_TEST != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: s3-fetch-artifacts
          path: |
            cert_sources/staged/ci-s3-test/**
            ci-test-s3.yaml
  gcs-fetch:
    name: 'Test: GCS Fetcher (Google Cloud Storage)'
    runs-on: ubuntu-latest
    environment: cloud-tests
    permissions:
      contents: read
    if: >-
      ${{ github.event.inputs.test_types == '' || contains(github.event.inputs.test_types, 'gcs') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install BundleCraft (with GCS fetcher)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,fetchers]"
      - name: Setup GCS credentials
        env:
          GCS_CREDENTIALS_JSON: ${{ secrets.GCS_CREDENTIALS_JSON }}
        shell: bash
        run: |
          # Check if credentials are set
          if [ -z "${GCS_CREDENTIALS_JSON:-}" ]; then
            echo "::warning::GCS test skipped - required secret GCS_CREDENTIALS_JSON not configured"
            echo "SKIP_TEST=true" >> "$GITHUB_ENV"
            exit 0
          fi

          # Write credentials to file
          mkdir -p ~/.config/gcloud
          echo "${GCS_CREDENTIALS_JSON}" > ~/.config/gcloud/application_default_credentials.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/.config/gcloud/application_default_credentials.json" >> "$GITHUB_ENV"
      - name: Generate bundle config for GCS test (ci-test-gcs.yaml)
        if: env.SKIP_TEST != 'true'
        env:
          GCS_BUCKET: ${{ secrets.GCS_TEST_BUCKET }}
          GCS_OBJECT_PATH: ${{ secrets.GCS_TEST_OBJECT_PATH }}
          GCS_PROJECT: ${{ secrets.GCS_TEST_PROJECT }}
        shell: bash
        run: |
          # Check if required environment variables are set
          if [ -z "${GCS_BUCKET:-}" ] || [ -z "${GCS_OBJECT_PATH:-}" ]; then
            echo "::warning::GCS test skipped - required secrets GCS_TEST_BUCKET or GCS_TEST_OBJECT_PATH not configured"
            echo "SKIP_TEST=true" >> "$GITHUB_ENV"
            exit 0
          fi

          # Generate GCS test config
          cat > ci-test-gcs.yaml <<YAML
          source_name: ci-gcs-test
          description: CI test bundle for GCS fetcher validation
          fetch:
            - name: from_gcs
              type: gcs
              bucket: ${GCS_BUCKET}
              object_path: ${GCS_OBJECT_PATH}
          YAML

          # Add project if provided
          if [ -n "${GCS_PROJECT:-}" ]; then
            echo "              project: ${GCS_PROJECT}" >> ci-test-gcs.yaml
          fi
          echo "Generated ci-test-gcs.yaml:" && cat ci-test-gcs.yaml
      - name: Run GCS fetch
        if: env.SKIP_TEST != 'true'
        run: |
          bundlecraft fetch --verbose --source-config-file ci-test-gcs.yaml --json
      - name: Verify GCS fetch outputs
        if: env.SKIP_TEST != 'true'
        run: |
          echo "Checking staged outputs:"
          test -f cert_sources/staged/ci-gcs-test/fetch/from_gcs/from_gcs.pem || { echo "❌ Missing from_gcs.pem"; exit 1; }
          test -f cert_sources/staged/ci-gcs-test/fetch/from_gcs/provenance.fetch.json || { echo "❌ Missing provenance"; exit 1; }
          echo "✅ GCS fetch successful"
      - name: GCS job summary
        if: env.SKIP_TEST != 'true'
        run: |
          echo "## GCS fetcher" >> "$GITHUB_STEP_SUMMARY"
          echo "- Bucket: ${{ secrets.GCS_TEST_BUCKET }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Object Path: ${{ secrets.GCS_TEST_OBJECT_PATH }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Project: ${{ secrets.GCS_TEST_PROJECT || 'default' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: Success" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload GCS job artifacts
        if: always() && env.SKIP_TEST != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gcs-fetch-artifacts
          path: |
            cert_sources/staged/ci-gcs-test/**
            ci-test-gcs.yaml
  azure-blob-fetch:
    name: 'Test: Azure Blob Fetcher'
    runs-on: ubuntu-latest
    environment: cloud-tests
    permissions:
      contents: read
    if: >-
      ${{ github.event.inputs.test_types == '' || contains(github.event.inputs.test_types, 'azure_blob') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install BundleCraft (with Azure Blob fetcher)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,fetchers]"
      - name: Generate bundle config for Azure Blob test (ci-test-azure-blob.yaml)
        env:
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_TEST_STORAGE_ACCOUNT }}
          AZURE_CONTAINER: ${{ secrets.AZURE_TEST_CONTAINER }}
          AZURE_BLOB_NAME: ${{ secrets.AZURE_TEST_BLOB_NAME }}
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        shell: bash
        run: |
          # Check if required environment variables are set
          if [ -z "${AZURE_STORAGE_ACCOUNT:-}" ] || [ -z "${AZURE_CONTAINER:-}" ] || [ -z "${AZURE_BLOB_NAME:-}" ]; then
            echo "::warning::Azure Blob test skipped - required secrets AZURE_TEST_STORAGE_ACCOUNT, AZURE_TEST_CONTAINER, or AZURE_TEST_BLOB_NAME not configured"
            echo "SKIP_TEST=true" >> "$GITHUB_ENV"
            exit 0
          fi

          # Generate Azure Blob test config
          # Use connection string if available, otherwise fall back to managed identity
          if [ -n "${AZURE_STORAGE_CONNECTION_STRING:-}" ]; then
            cat > ci-test-azure-blob.yaml <<YAML
          source_name: ci-azure-blob-test
          description: CI test bundle for Azure Blob fetcher validation
          fetch:
            - name: from_azure_blob
              type: azure_blob
              container: ${AZURE_CONTAINER}
              blob_name: ${AZURE_BLOB_NAME}
              connection_string_ref: AZURE_STORAGE_CONNECTION_STRING
          YAML
          else
            cat > ci-test-azure-blob.yaml <<YAML
          source_name: ci-azure-blob-test
          description: CI test bundle for Azure Blob fetcher validation
          fetch:
            - name: from_azure_blob
              type: azure_blob
              container: ${AZURE_CONTAINER}
              blob_name: ${AZURE_BLOB_NAME}
              account_name: ${AZURE_STORAGE_ACCOUNT}
              use_managed_identity: true
          YAML
          fi
          echo "Generated ci-test-azure-blob.yaml:" && cat ci-test-azure-blob.yaml
      - name: Run Azure Blob fetch
        if: env.SKIP_TEST != 'true'
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        run: |
          bundlecraft fetch --verbose --source-config-file ci-test-azure-blob.yaml --json
      - name: Verify Azure Blob fetch outputs
        if: env.SKIP_TEST != 'true'
        run: |
          echo "Checking staged outputs:"
          test -f cert_sources/staged/ci-azure-blob-test/fetch/from_azure_blob/from_azure_blob.pem || { echo "❌ Missing from_azure_blob.pem"; exit 1; }
          test -f cert_sources/staged/ci-azure-blob-test/fetch/from_azure_blob/provenance.fetch.json || { echo "❌ Missing provenance"; exit 1; }
          echo "✅ Azure Blob fetch successful"
      - name: Azure Blob job summary
        if: env.SKIP_TEST != 'true'
        run: |
          echo "## Azure Blob fetcher" >> "$GITHUB_STEP_SUMMARY"
          echo "- Storage Account: ${{ secrets.AZURE_TEST_STORAGE_ACCOUNT }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Container: ${{ secrets.AZURE_TEST_CONTAINER }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Blob Name: ${{ secrets.AZURE_TEST_BLOB_NAME }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: Success" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Azure Blob job artifacts
        if: always() && env.SKIP_TEST != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: azure-blob-fetch-artifacts
          path: |-
            cert_sources/staged/ci-azure-blob-test/**
            ci-test-azure-blob.yaml
