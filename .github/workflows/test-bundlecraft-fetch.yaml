---
name: 🥏 BundleCraft Fetch Test Suite
run-name: 'Fetch test suite - ${{ github.ref_name }} - Run  #${{ github.run_number }}'
on:
  workflow_dispatch:
jobs:
  vault-fetch:
    name: 'Test: Vault Fetcher (K/V v2 or v1)'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install BundleCraft (with Vault fetcher)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,fetchers]"
      - name: Generate bundle config for Vault test (ci-test-vault.yaml)
        shell: bash
        run: |
          cat > ci-test-vault.yaml <<'YAML'
          id: ci-vault-test
          include: []
          fetch:
            - name: from_vault
              type: vault
              mount_point: secret
              path: pki/trusted_roots
              pem_field: pem
              addr: http://127.0.0.1:8200
              token_ref: VAULT_TOKEN
          YAML
          echo "Wrote ci-test-vault.yaml:" && cat ci-test-vault.yaml
      - name: Ensure vault-local.sh is executable
        run: chmod +x scripts/vault-local.sh
      - name: Run local Vault and fetch via BundleCraft
        env:
          VAULT_ADDR: http://127.0.0.1:8200
          VAULT_TOKEN: root
        run: |
          ./scripts/vault-local.sh up --verbose --runtime podman --ci-cmd "bundlecraft fetch --config-file ci-test-vault.yaml" || { echo "Vault CI command failed"; exit 1; }
      - name: Verify Vault fetch outputs
        run: |
          echo "Checking staged outputs:"
          test -f sources/fetched/ci/ci-vault-test/from_vault.pem || { echo "❌ Missing from_vault.pem"; exit 1; }
          test -f sources/fetched/ci/ci-vault-test/provenance.fetch.json || { echo "❌ Missing provenance"; exit 1; }
          echo "✅ Vault fetch successful"
      - name: Upload Vault job artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vault-fetch-artifacts
          path: |
            sources/fetched/ci/ci-vault-test/**
            local_vault/**
            local_vault_artifacts/**
            ci-test-vault.yaml
  http-fetch:
    name: 'Test: HTTP Fetcher (Nginx with pinning)'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install BundleCraft
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,fetchers]"
      - name: Generate test certificate and content for HTTPS server
        run: |
          mkdir -p ci-http-test
          # Generate a local CA
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout ci-http-test/ca.key -out ci-http-test/ca.crt \
            -days 2 -subj "/CN=BundleCraft Test CA" \
            -addext "basicConstraints=critical,CA:TRUE"
          # Generate server key and CSR with SAN for 127.0.0.1
          openssl genrsa -out ci-http-test/server.key 2048
          cat > ci-http-test/server.cnf <<'CNF'
          [req]
          prompt = no
          distinguished_name = dn
          req_extensions = v3_req
          [dn]
          CN = localhost
          [v3_req]
          subjectAltName = @alt_names
          [alt_names]
          DNS.1 = localhost
          IP.1 = 127.0.0.1
          CNF
          openssl req -new -key ci-http-test/server.key -out ci-http-test/server.csr -config ci-http-test/server.cnf
          # Sign server cert with local CA (includes SAN)
          cat > ci-http-test/server.ext <<'EXT'
          basicConstraints=CA:FALSE
          keyUsage = digitalSignature, keyEncipherment
          extendedKeyUsage = serverAuth
          subjectAltName = @alt_names
          [alt_names]
          DNS.1 = localhost
          IP.1 = 127.0.0.1
          EXT
          openssl x509 -req -in ci-http-test/server.csr -CA ci-http-test/ca.crt -CAkey ci-http-test/ca.key -CAcreateserial \
            -out ci-http-test/server.crt -days 1 -extfile ci-http-test/server.ext

          # Create a test PEM to serve
          cat > ci-http-test/test-cert.pem <<'PEM'
          -----BEGIN CERTIFICATE-----
          MIICxjCCAa6gAwIBAgIUTest123456789ABCDEFGHIJKLMN0wDQYJKoZIhvcNAQEL
          BQAwDzENMAsGA1UEAwwEVEVTVDAeFw0yNTAxMDEwMDAwMDBaFw0zNTAxMDEwMDAw
          MDBaMA8xDTALBgNVBAMMBFRFU1QwggEiMA0GCSqGSIb3DQEBAQUAA4IBDwAwggEK
          AoIBAQDExampleCertDataHere123456789ABCDEFGHIJKLMNOP
          -----END CERTIFICATE-----
          PEM

          # Compute SHA256 of server cert for pinning test
          openssl x509 -in ci-http-test/server.crt -outform DER | sha256sum | awk '{print $1}' > ci-http-test/fingerprint.txt
          echo "Server cert fingerprint: $(cat ci-http-test/fingerprint.txt)"

          # Create nginx config for HTTPS
          cat > ci-http-test/nginx.conf <<'NGINX'
          events {
            worker_connections 1024;
          }
          http {
            server {
              listen 8443 ssl;
              ssl_certificate /etc/nginx/certs/server.crt;
              ssl_certificate_key /etc/nginx/certs/server.key;
              location /test-cert.pem {
                root /usr/share/nginx/html;
                add_header Content-Type application/x-pem-file;
              }
            }
          }
          NGINX
      - name: Start HTTPS server in Podman
        run: |
          # Run nginx container with our certs and config
          podman run -d \
            --name bundlecraft-https-test \
            -p 8443:8443 \
            -v "$(pwd)/ci-http-test/server.crt:/etc/nginx/certs/server.crt:ro,Z" \
            -v "$(pwd)/ci-http-test/server.key:/etc/nginx/certs/server.key:ro,Z" \
            -v "$(pwd)/ci-http-test/test-cert.pem:/usr/share/nginx/html/test-cert.pem:ro,Z" \
            -v "$(pwd)/ci-http-test/nginx.conf:/etc/nginx/nginx.conf:ro,Z" \
            docker.io/library/nginx:alpine
          sleep 2
            # Wait for HTTPS to be ready
            for i in {1..20}; do
              if curl -sk --cacert ci-http-test/ca.crt https://127.0.0.1:8443/test-cert.pem >/dev/null; then
                echo "HTTPS endpoint is ready"; break; fi; sleep 1; done
            curl -sk --cacert ci-http-test/ca.crt https://127.0.0.1:8443/test-cert.pem >/dev/null || { echo "Server did not become ready"; exit 1; }
          echo "HTTPS server started on https://127.0.0.1:8443"
      - name: Generate HTTP fetch config (ci-test-http.yaml)
        run: |
          FINGERPRINT=$(cat ci-http-test/fingerprint.txt)
          # Use absolute path for ca_file
          CA_FILE="$(pwd)/ci-http-test/ca.crt"
          cat > ci-test-http.yaml <<YAML
          id: ci-http-test
          include: []
          fetch:
            - name: from_https
              type: url
              url: https://127.0.0.1:8443/test-cert.pem
              verify:
                ca_file: ${CA_FILE}
                ca_file: ${CA_FILE}
                tls_fingerprint_sha256: "$FINGERPRINT"
          YAML
          echo "Generated ci-test-http.yaml with CA trust and fingerprint pinning"
      - name: Run HTTP fetch with pinning
        run: |
          bundlecraft fetch --config-file ci-test-http.yaml
      - name: Verify HTTP fetch outputs
        run: |
          echo "Checking staged outputs:"
          test -f sources/fetched/ci/ci-http-test/from_https.pem || { echo "❌ Missing from_https.pem"; exit 1; }
          test -f sources/fetched/ci/ci-http-test/provenance.fetch.json || { echo "❌ Missing provenance"; exit 1; }
          echo "✅ HTTP fetch with pinning successful"
      - name: HTTP job summary
        run: |
          echo "## HTTP fetcher" >> "$GITHUB_STEP_SUMMARY"
          echo "- Endpoint: https://127.0.0.1:8443/test-cert.pem" >> "$GITHUB_STEP_SUMMARY"
          echo "- Used CA file: ci-http-test/ca.crt" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: Success" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload HTTP job artifacts
        uses: actions/upload-artifact@v4
        with:
          name: http-fetch-artifacts
          path: |
            sources/fetched/ci/ci-http-test/**
            ci-http-test/**
            ci-test-http.yaml
      - name: Cleanup
        if: always()
        run: |
          podman rm -f bundlecraft-https-test || true
  api-fetch:
    name: 'Test: API Fetcher (Keyfactor API Mock)'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install BundleCraft
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,fetchers]"
      - name: Generate self-signed cert and mock API server
        run: |
          mkdir -p ci-api-test

          # Self-signed cert for HTTPS
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout ci-api-test/api.key -out ci-api-test/api.crt -days 1 \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"

          # Create mock certificate to return from API
          cat > ci-api-test/mock-ca.pem <<'PEM'
          -----BEGIN CERTIFICATE-----
          MIICxjCCAa6gAwIBAgIUMockKeyfactorCA123456789ABCDEF0wDQYJKoZIhvcN
          AQELBQAwFTETMBEGA1UEAwwKS2V5ZmFjdG9yQ0EwHhcNMjUwMTAxMDAwMDAwWhcN
          MzUwMTAxMDAwMDAwWjAVMRMwEQYDVQQDDApLZXlmYWN0b3JDQTCCASIwDQYJKoZI
          hvcNAQEBBQADggEPADCCAQoCggEBAMockDataForTestingOnly
          -----END CERTIFICATE-----
          PEM

          # Create simple Flask mock API server
          cat > ci-api-test/mock_api.py <<'PYCODE'
          from flask import Flask, Response, request
          import ssl
          app = Flask(__name__)
          @app.route('/KeyfactorAPI/CertificateAuthority/Download')
          def download_cert():
              # Verify bearer token
              auth = request.headers.get('Authorization', '')
              if not auth.startswith('Bearer '):
                  return Response('Unauthorized', status=401)

              # Return mock certificate
              with open('mock-ca.pem', 'r') as f:
                  cert_data = f.read()
              return Response(cert_data, mimetype='application/x-pem-file')
          if __name__ == '__main__':
              context = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
              context.load_cert_chain('api.crt', 'api.key')
              app.run(host='0.0.0.0', port=8443, ssl_context=context)
          PYCODE

          # Create Dockerfile for the mock API
          cat > ci-api-test/Dockerfile <<'DOCKERFILE'
          FROM python:3.11-alpine
          WORKDIR /app
          RUN pip install --no-cache-dir flask
          COPY mock_api.py api.crt api.key mock-ca.pem ./
          EXPOSE 8443
          CMD ["python", "mock_api.py"]
          DOCKERFILE
      - name: Build and start mock API container
        run: |
          cd ci-api-test
          # Build container image
          podman build -t bundlecraft-api-mock .

          # Run container
          podman run -d \
            --name bundlecraft-api-test \
            -p 8443:8443 \
            bundlecraft-api-mock
          sleep 3
          # Wait for HTTPS to be ready
          for i in {1..20}; do
            if curl -sk --cacert ../ci-api-test/api.crt https://127.0.0.1:8443/KeyfactorAPI/CertificateAuthority/Download >/dev/null; then
              echo "API endpoint is ready"; break; fi; sleep 1; done
          curl -sk --cacert ../ci-api-test/api.crt https://127.0.0.1:8443/KeyfactorAPI/CertificateAuthority/Download >/dev/null || { echo "API did not become ready"; exit 1; }
          echo "Mock API started on https://127.0.0.1:8443"
          sleep 3
          echo "Mock API started on https://127.0.0.1:8443"
      - name: Generate API fetch config (ci-test-api.yaml)
        run: |
          # Use absolute path for ca_file
          CA_FILE="$(pwd)/ci-api-test/api.crt"
          cat > ci-test-api.yaml <<YAML
          id: ci-api-test
          include: []
          fetch:
            - name: from_keyfactor_mock
              type: api
              endpoint: https://127.0.0.1:8443/KeyfactorAPI/CertificateAuthority/Download
              provider: keyfactor
              token_ref: KEYFACTOR_TOKEN
              verify:
                ca_file: ${CA_FILE}
          YAML
          echo "Generated ci-test-api.yaml"
      - name: Run API fetch
        env:
          KEYFACTOR_TOKEN: mock-token-12345
        run: |
          bundlecraft fetch --config-file ci-test-api.yaml
      - name: Verify API fetch outputs
        run: |-
          echo "Checking staged outputs:"
          test -f sources/fetched/ci/ci-api-test/from_keyfactor_mock.pem || { echo "❌ Missing from_keyfactor_mock.pem"; exit 1; }
          test -f sources/fetched/ci/ci-api-test/provenance.fetch.json || { echo "❌ Missing provenance"; exit 1; }
          echo "✅ API fetch (Keyfactor mock) successful"
      - name: API job summary
        run: |
          echo "## API fetcher" >> "$GITHUB_STEP_SUMMARY"
          echo "- Endpoint: https://127.0.0.1:8443/KeyfactorAPI/CertificateAuthority/Download" >> "$GITHUB_STEP_SUMMARY"
          echo "- Used CA file: ci-api-test/api.crt" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: Success" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload API job artifacts
        uses: actions/upload-artifact@v4
        with:
          name: api-fetch-artifacts
          path: |
            sources/fetched/ci/ci-api-test/**
            ci-api-test/**
            ci-test-api.yaml
      - name: Cleanup
        if: always()
        run: |-
          podman rm -f bundlecraft-api-test || true
