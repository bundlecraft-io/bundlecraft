---
name: 📦 Release to PyPI
run-name: 'Release ${{ github.ref_name }} - Run #${{ github.run_number }}'
on:
  push:
    branches: [main, pre-release]
    tags:
      - v*  # Trigger on version tags like v0.1.0, v0.2.0, etc.
permissions:
  contents: write  # For creating GitHub releases
  id-token: write  # For PyPI trusted publishing
env:
  MAIN_BRANCH: main
  PRE_RELEASE_BRANCH: pre-release
jobs:
  determine-channel:
    name: Determine Release Channel
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.check.outputs.channel }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine source branch
        id: check
        run: |
          TAG_SHA=$(git rev-parse "$GITHUB_SHA")

          # Fetch both branches
          git fetch origin +refs/heads/${{ env.MAIN_BRANCH }}:refs/remotes/origin/${{ env.MAIN_BRANCH }} || true
          git fetch origin +refs/heads/${{ env.PRE_RELEASE_BRANCH }}:refs/remotes/origin/${{ env.PRE_RELEASE_BRANCH }} || true

          # Check ancestry
          if git merge-base --is-ancestor "$TAG_SHA" "origin/${{ env.MAIN_BRANCH }}"; then
            echo "channel=prod" >> $GITHUB_OUTPUT
            echo "✅ Tag from main branch → Production PyPI"
          elif git merge-base --is-ancestor "$TAG_SHA" "origin/${{ env.PRE_RELEASE_BRANCH }}"; then
            echo "channel=prerelease" >> $GITHUB_OUTPUT
            echo "✅ Tag from pre-release branch → Test PyPI"
          else
            echo "❌ Tag not from main or pre-release branch"
            exit 1
          fi
  test:
    name: Run Tests
    needs: determine-channel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -v --cov=bundlecraft --cov-report=term
      - name: Run linting
        run: ruff check bundlecraft tests
  build:
    name: Build Package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      - name: Build package
        run: python -m build
      - name: Verify package
        run: twine check dist/*
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
  # The following jobs only run based on the determined release channel (main or pre-release branch)
  # AND if a semantic version tag (e.g., v1.2.3) is pushed  on those branches to mark an official release.
  publish-pypi:
    name: Publish to PyPI
    needs: [build, determine-channel]
    if: needs.determine-channel.outputs.channel == 'prod' && startsWith(github.ref,
      'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/p/bundlecraft
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
          print-hash: true
  publish-testpypi:
    name: Publish to Test PyPI
    needs: [build, determine-channel]
    if: needs.determine-channel.outputs.channel == 'prerelease' && startsWith(github.ref,
      'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://test.pypi.org/p/bundlecraft
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          verbose: true
          print-hash: true
  github-release:
    name: Create GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      - name: Create release notes
        run: |
          cat > release_notes.md << 'EOF'
          ## Installation
          ```bash
          pip install bundlecraft==${{ steps.version.outputs.VERSION }}
          ```

          ## Package Contents
          - `bundlecraft-${{ steps.version.outputs.VERSION }}-py3-none-any.whl` - Wheel distribution
          - `bundlecraft-${{ steps.version.outputs.VERSION }}.tar.gz` - Source distribution
          EOF
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          bodyFile: release_notes.md
          artifacts: dist/*
          allowUpdates: true
          makeLatest: true
          generateReleaseNotes: true
  github-prerelease:
    name: Create GitHub Pre-Release
    needs: publish-testpypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      - name: Create pre-release notes
        run: |
          cat > release_notes.md << 'EOF'
          ## Pre-Release - Test PyPI Only

          ### Installation
          ```bash
          pip install --index-url https://test.pypi.org/simple/ \
                      --extra-index-url https://pypi.org/simple/ \
                      bundlecraft==${{ steps.version.outputs.VERSION }}
          ```
          EOF
      - name: Create GitHub Pre-Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          bodyFile: release_notes.md
          artifacts: dist/*
          allowUpdates: true
          prerelease: true
          generateReleaseNotes: true
  verify-release:
    name: Verify PyPI Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Wait for PyPI indexing
        run: sleep 60
      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      - name: Install from PyPI
        run: pip install bundlecraft==${{ steps.version.outputs.VERSION }}
      - name: Verify installation
        run: |
          bundlecraft --version
          bundlecraft --help
  verify-testpypi:
    name: Verify Test PyPI Release
    needs: publish-testpypi
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Wait for Test PyPI indexing
        run: sleep 60
      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      - name: Install from Test PyPI
        run: |
          pip install --index-url https://test.pypi.org/simple/ \
                      --extra-index-url https://pypi.org/simple/ \
                      bundlecraft==${{ steps.version.outputs.VERSION }}
      - name: Verify installation
        run: |-
          bundlecraft --version
          bundlecraft --help
